<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خارطة العراق التفاعلية</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="page-title">خارطة العراق التفاعلية</h2>

<div class="main-layout">
    <div class="side-panel">
        <h3>التحكم</h3>
        <button onclick="updateMap('all')">عرض الكل</button>
        <button onclick="updateMap('affected')">المناطق المتضررة</button>
        <button onclick="updateMap('hope')">مناطق الأمل</button>

        <div id="side-image-container">
            <img id="location-image" src="" alt="">
            <div id="no-image-placeholder">لا توجد صورة لهذا الموقع</div>
            <h3 id="location-title"></h3>
            <p id="location-desc"></p>
        </div>

        <div id="default-msg">
            انقر على أي دائرة في الخريطة<br>لعرض الصور والتفاصيل هنا
        </div>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
